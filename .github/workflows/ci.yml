name: CI

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint / Format / Types / Test / Build / Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Docs check
        run: bun run docs:check

  continuous-release:
    name: Continuous Release
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && github.repository_owner == 'dipakparmar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: 📦 release pkg.pr.new
        run: bunx pkg-pr-new publish --compact ./packages/zoho-billing ./packages/zoho-billing-react
